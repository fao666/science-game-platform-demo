<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef4ff" />
    <title>急诊室复电行动｜四年级科学</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="../index.html" aria-label="返回科学能量站课程大厅"><span>←</span>返回课程大厅</a>
        <div class="crumb">四年级科学　/　电路　/　急诊室复电行动</div>
        <span class="quiet-button">🎮 可玩样关</span>
      </header>
      <main>
        <section class="briefing">
          <div>
            <span class="lesson-pill">四年级下册 · 电路</span>
            <h1>急诊室复电行动</h1>
            <p>控制维修机器人调查停电，在医院里找到元件，亲手接通备用照明回路。</p>
          </div>
          <div class="goal-card"><b>学习目标</b><span>用完整通路解释小灯泡为什么亮或不亮</span></div>
        </section>
        <section class="game-card">
          <div id="game" aria-label="医院电路教育游戏"></div>
          <aside class="side-panel">
            <div class="task-head"><span>当前任务</span><b id="taskCount">1 / 4</b></div>
            <h2 id="taskTitle">去护士站了解情况</h2>
            <p id="taskText">移动到护士身边，按 E 或点击护士进行交流。</p>
            <div class="progress"><i id="progressBar"></i></div>
            <div class="inventory-title">维修工具箱</div>
            <div class="inventory" id="inventory">
              <div data-item="battery"><span>🔋</span><b>电池</b><small>未取得</small></div>
              <div data-item="lamp"><span>💡</span><b>灯泡</b><small>未取得</small></div>
              <div data-item="switch"><span>🎚️</span><b>开关</b><small>未取得</small></div>
            </div>
            <button id="hintButton" class="hint-button" type="button">🤖 给我一个线索</button>
            <div id="hintText" class="hint-text">线索会引导观察，不直接给出答案。</div>
            <details class="research-log">
              <summary>本次体验记录 <span id="eventCount">0 条</span></summary>
              <div id="eventPreview">等待开始……</div>
              <button id="downloadLog" type="button">导出体验记录</button>
            </details>
          </aside>
        </section>
        <div class="controls-note"><b>电脑：</b>方向键 / WASD 移动，E 互动　　<b>触屏：</b>点击地面移动，点击人物或物品互动</div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
